<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Córdoba Smoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff; --ink-soft:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.35);
  --card:rgba(24,12,34,.46);
  --lime:#5dff4d; --cyan:#35d9ff; --pink:#ff4fa3; --white:#f4f0ff;
  --accent:#3b82f6;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Segoe UI",system-ui,sans-serif;
  color:var(--ink); background:#12081a; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(10,4,16,.35),rgba(10,4,16,0) 22%,rgba(10,4,16,0) 60%,rgba(10,4,16,.55))}

.tabs{
  position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:10;
  max-width:560px;margin:0 auto;display:flex;padding:6px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 30px rgba(0,0,0,.35);
}
.tab{
  flex:1;height:52px;border:0;border-radius:999px;background:transparent;color:var(--ink);
  display:grid;place-items:center;cursor:pointer;position:relative;z-index:1;
  -webkit-tap-highlight-color:transparent;transition:color .2s;
}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.tab[aria-selected="true"]{color:#fff}
.pill{
  position:absolute;top:6px;bottom:6px;left:6px;border-radius:999px;z-index:0;
  background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .35s cubic-bezier(.3,1.2,.4,1);
}

main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 92px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.panel{display:none}
.panel.on{display:block}
#inicio.on{display:flex;align-items:center;min-height:calc(100svh - 150px - env(safe-area-inset-top,0px))}
#inicio .card{width:100%}

.card{
  background:var(--card);border:1px solid rgba(255,255,255,.18);border-radius:32px;padding:24px;
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}
.card h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;text-align:center}
.card p{margin-top:10px;color:var(--ink-soft);font-size:17px;line-height:1.4;text-align:center}
.btn{
  display:block;width:100%;margin-top:20px;height:52px;border:0;border-radius:999px;
  background:var(--accent);color:#fff;font:600 19px/1 inherit;font-family:inherit;cursor:pointer;
  text-align:center;text-decoration:none;line-height:52px;
}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.alt{background:rgba(255,255,255,.2);border:1px solid var(--glass-line)}

h2{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:32px 4px 14px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.first{margin-top:0}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
.fav{border:0;background:none;color:var(--ink);cursor:pointer;font-family:inherit;text-align:center;-webkit-tap-highlight-color:transparent}
.icon{
  aspect-ratio:1;border-radius:24%;display:grid;place-items:center;
  background:rgba(20,10,30,.55);border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-weight:900;font-size:clamp(15px,4.6vw,22px);letter-spacing:-.02em;padding:6px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.fav span{display:block;margin-top:8px;font-size:15px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.fav:focus-visible .icon{outline:3px solid #fff}
.c-lime{color:var(--lime);text-shadow:0 0 14px rgba(93,255,77,.6)}
.c-cyan{color:var(--cyan);text-shadow:0 0 14px rgba(53,217,255,.6)}
.c-pink{color:var(--pink);text-shadow:0 0 14px rgba(255,79,163,.6)}
.c-white{color:var(--white);text-shadow:0 0 14px rgba(255,255,255,.4)}
.stack{display:grid;gap:12px}
.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(8px);animation:wIn .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes wIn{to{opacity:1;transform:none;filter:none}}
.fade{opacity:0;animation:fIn .8s ease forwards;animation-delay:var(--d,1.6s)}
@keyframes fIn{to{opacity:1}}
#inicio .card{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 10px 40px rgba(0,0,0,.35),0 0 0 rgba(93,255,77,0)}50%{box-shadow:0 10px 40px rgba(0,0,0,.35),0 0 38px rgba(93,255,77,.28),0 0 70px rgba(53,217,255,.18)}}
.chat h1{font-size:24px}
.log{display:grid;gap:10px;margin-top:16px;max-height:46svh;overflow-y:auto;align-content:start}
.msg{padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.35;max-width:88%;overflow-wrap:anywhere}
.msg.bot{background:rgba(255,255,255,.14);justify-self:start}
.msg.me{background:var(--accent);justify-self:end}
.send{display:flex;gap:8px;margin-top:14px}
.send input{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--glass-line);background:rgba(255,255,255,.14);color:#fff;padding:0 16px;font:16px inherit;font-family:inherit}
.send input::placeholder{color:rgba(255,255,255,.6)}
.send input:focus-visible{outline:2px solid #fff}
.send .btn{width:auto;margin-top:0;height:48px;line-height:48px;padding:0 20px;font-size:17px}
@media (prefers-reduced-motion:reduce){.pill{transition:none}.w,.fade{animation:none;opacity:1;transform:none;filter:none}#inicio .card{animation:none}}

.group{font-size:18px;font-weight:700;margin:26px 4px 10px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.group.first{margin-top:0}
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:12px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:var(--card);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.row:active{transform:scale(.98)}
.row:focus-visible{outline:3px solid #fff}
.row b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.row small{display:block;font-size:14px;color:var(--ink-soft);margin-top:2px;font-weight:500}
.row svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--ink-soft);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,2,10,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:84svh;overflow-y:auto;padding:24px 22px calc(env(safe-area-inset-bottom,0px) + 24px);border-radius:32px 32px 0 0;background:rgba(28,14,40,.84);border:1px solid rgba(255,255,255,.22);border-bottom:0;-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1),visibility 0s .35s}
.sheet.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet h3{font-size:32px;font-weight:900;letter-spacing:-.02em;padding-right:48px;line-height:1.1}
.x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;display:grid;place-items:center}
.x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.x:focus-visible{outline:2px solid #fff}
.sec{margin-top:20px}
.sec h4{font-size:15px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.price{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:19px}
.price:last-child{border-bottom:0}
.price b{font-weight:800}
.tipo{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.18);font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-size:15px}
.desc{font-size:16px;line-height:1.4;color:var(--ink-soft)}
.note{font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:20px}
.c-violet{color:#c9a0ff;text-shadow:0 0 14px rgba(201,160,255,.6)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.row{transition:none}}

.price{align-items:center}
.pr{display:flex;align-items:center;gap:12px}
.add{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.add svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.add:active{transform:scale(.9)}
.add:focus-visible{outline:2px solid #fff;outline-offset:2px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#ff3b5c;color:#fff;font-family:inherit;font-weight:700;font-size:12px;line-height:19px;text-align:center}
.badge[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);z-index:40;max-width:90vw;padding:11px 20px;border-radius:999px;background:rgba(20,10,30,.92);border:1px solid rgba(255,255,255,.25);font-weight:600;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.item b{font-size:20px;font-weight:800;display:block}
.item small{font-size:14px;color:var(--ink-soft)}
.qty{display:flex;align-items:center;gap:10px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(255,255,255,.16);color:#fff;font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
.qty button:focus-visible{outline:2px solid #fff}
.qty span{min-width:20px;text-align:center;font-weight:700;font-size:18px}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:18px 6px 0;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.foto{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 30%;border-radius:22px;margin-top:18px;background:#000}
@keyframes pIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.panel.on:not(#inicio){animation:pIn .45s cubic-bezier(.2,.8,.2,1)}
#sabores .row{animation:rowIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0)*50ms + 100ms)}
@media (prefers-reduced-motion:reduce){.panel.on:not(#inicio),#sabores .row{animation:none}}
@keyframes shUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fotoIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.sheet{overflow-x:hidden}
.sheet.on h3{animation:shUp .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:.1s}
.sheet.on #sh-body>*{animation:shUp .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0)*70ms + 180ms)}
.sheet.on #sh-body>.foto{animation:fotoIn .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:.15s}
.sheet.on .chip{animation:chipIn .4s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(var(--c,0)*60ms + 500ms)}
.chip:nth-child(2){--c:1}.chip:nth-child(3){--c:2}.chip:nth-child(4){--c:3}
@media (prefers-reduced-motion:reduce){.sheet.on h3,.sheet.on #sh-body>*,.sheet.on .chip{animation:none}}
#ia .quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#ia .quick[hidden]{display:none}
#ia .quick button{padding:8px 14px;border-radius:999px;border:1px solid var(--glass-line);background:rgba(255,255,255,.14);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ia .quick button:active{transform:scale(.96)}
#ia .quick button:focus-visible{outline:2px solid #fff}

:root{--serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;--card:rgba(20,9,30,.52);--hair:rgba(255,255,255,.16)}
.shade{background:radial-gradient(120% 70% at 50% 45%,rgba(10,4,16,0) 40%,rgba(10,4,16,.55) 100%),linear-gradient(to bottom,rgba(10,4,16,.45),rgba(10,4,16,0) 22%,rgba(10,4,16,0) 55%,rgba(10,4,16,.6))}
.tabs{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.1));border-color:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 40px rgba(0,0,0,.45)}
.pill{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 14px rgba(0,0,0,.25)}
.tab svg{stroke-width:1.9}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 45%),var(--card);border:1px solid var(--hair);border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 50px rgba(0,0,0,.45)}
.card h1{font-family:var(--serif);font-weight:700;letter-spacing:0;font-size:30px}
.card p{font-size:16px;letter-spacing:.01em}
#inicio .card{padding:36px 26px 28px}
#inicio .card::before{content:"";display:block;width:48px;height:2px;margin:0 auto 22px;border-radius:2px;background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 14px rgba(93,255,77,.6)}
.slogan{font-family:var(--serif);font-style:italic;font-weight:700;font-size:36px!important;line-height:1.12;text-wrap:balance}
.btn{background:linear-gradient(135deg,#8b5cf6,#3b82f6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px rgba(80,90,255,.4);font-weight:600;letter-spacing:.01em}
.btn.alt{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border:1px solid var(--hair)}
.group{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.85);margin:30px 4px 14px}
.group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.4),transparent)}
.group.first{margin-top:4px}
.row{min-height:70px;padding:12px 20px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 50%),var(--card);border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.3)}
.row b{font-family:var(--serif);font-style:italic;font-weight:700;font-size:28px;letter-spacing:0;line-height:1.05}
.row small{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:4px;font-weight:600}
.row svg{stroke:rgba(255,255,255,.55)}
.sheet{background:linear-gradient(180deg,rgba(44,22,64,.9),rgba(18,8,30,.96));border-color:rgba(255,255,255,.2)}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);margin:-12px auto 16px}
.sheet h3{font-family:var(--serif);font-style:italic;font-weight:700;font-size:42px;letter-spacing:0;line-height:1}
.foto{border-radius:22px;border:1px solid var(--hair);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.sec h4{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.price{border-bottom-color:rgba(255,255,255,.12);font-size:17px}
.price b{font-family:var(--serif);font-size:27px;font-weight:700}
.tipo{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:1px solid var(--hair);letter-spacing:.02em}
.chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}
.desc{font-size:16px;line-height:1.5}
.add{background:linear-gradient(135deg,#8b5cf6,#3b82f6);box-shadow:0 6px 16px rgba(80,90,255,.45)}
.item{border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 50%),var(--card);border-color:var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.3)}
.item b{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.05}
.total{font-family:var(--serif);font-size:30px;font-weight:700}
.msg{border-radius:22px}
.msg.bot{background:rgba(255,255,255,.12);border:1px solid var(--hair)}
.msg.me{background:linear-gradient(135deg,#8b5cf6,#3b82f6)}
#ia .quick button{background:rgba(255,255,255,.1)}

#sabores .group{display:block;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);margin:26px 4px 10px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#sabores .group::after{content:none}
#sabores .group.first{margin-top:0}
#sabores .row b{display:inline-block;font-family:inherit;font-style:normal;font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.2}
#sabores .row small{font-size:14px;letter-spacing:0;text-transform:none;margin-top:2px;font-weight:500}
@keyframes rowIn2{from{opacity:0;transform:translateX(-30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes grpIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes shine{0%{transform:translateX(-130%)}22%,100%{transform:translateX(130%)}}
@keyframes neon{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
#sabores .row{position:relative;overflow:hidden;animation:rowIn2 .6s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--k,0)*75ms + 120ms)}
#sabores .row::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-130%);animation:shine 6s ease-in-out infinite;animation-delay:calc(var(--k,0)*.6s + 1.2s);pointer-events:none}
#sabores .row b{animation:neon 3.4s ease-in-out infinite;animation-delay:calc(var(--k,0)*.3s)}
#sabores .row svg{animation:nudge 2.4s ease-in-out infinite;animation-delay:calc(var(--k,0)*.2s)}
#sabores .group{animation:grpIn .5s ease backwards;animation-delay:.05s}
#sabores .row:active{transform:scale(.96)}
@media (hover:hover){#sabores .row:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 30px rgba(0,0,0,.4)}}
